services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: ${APP_LOCALE:-en_US}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en_US}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-securecampus}
      DB_USERNAME: ${POSTGRES_USER:-securecampus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-securecampus}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - app_key:/var/run/securecampus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecampus}
      POSTGRES_USER: ${POSTGRES_USER:-securecampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securecampus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  app_key:
  backend_vendor:
  frontend_node_modules:
  postgres_data:
  redis_data:
